name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      # リポジトリをチェックアウト（フル履歴）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpmをセットアップ
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.34.4"

      # nodeをセットアップ
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Takumi Guardをセットアップ
      - name: Use Takumi Guard
        uses: flatt-security/setup-takumi-guard-npm@v1

      # OIDCにnpm@11.5.1以降が必要
      - name: Install npm@latest
        run: npm install -g npm@latest

      # 依存関係をインストール
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 公開前の品質チェック
      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Full typecheck
        run: pnpm exec vue-tsc --noEmit -p tsconfig.json

      - name: Build
        run: pnpm build

      - name: Check package size
        run: pnpm size

      # 展開した tarball を消費者環境として検証
      - name: Smoke test packed package
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          pnpm pack --pack-destination "$tmp_dir" >/dev/null
          archive="$(find "$tmp_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          package_dir="$tmp_dir/package"
          mkdir "$package_dir"
          tar -xzf "$archive" -C "$package_dir" --strip-components=1
          ln -s "$GITHUB_WORKSPACE/node_modules" "$package_dir/node_modules"
          cd "$package_dir"
          node --input-type=module -e "await import('@j1nn0/vue-modal-dialog')"
          node -e "require('@j1nn0/vue-modal-dialog')"
          node -e "require.resolve('@j1nn0/vue-modal-dialog/style.css')"

      # 公開される型定義を消費者視点で検証（不正な使い方が落ちることまで確認）
      - name: Typecheck packed package from a consumer
        run: bash scripts/check-packed-types.sh

      # npm に公開（Git チェックをスキップ）
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%+*}"
          if [[ "$version" == *-* ]]; then
            npm_tag=rc
          else
            npm_tag=latest
          fi
          pnpm publish --access public --no-git-checks --provenance --tag "$npm_tag" --registry https://registry.npmjs.org/
